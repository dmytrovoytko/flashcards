<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <style>
        .definition { display: none; }
        .revealed .definition { display: block; }
        .revealed .btn-reveal { display: none; }
    </style>
</head>
<body class="container py-5">
    <div class="card shadow p-4 mx-auto text-center" style="max-width: max(70%, 600px);" id="quiz-card">
        <p class="text-muted small">Progress: {{ progress }} | Difficulty: {{ card.difficulty }}</p>
        <p class="text-muted small">Topic {{ card.topic_id }}: {{ topic.topic }}</p>
        <h2 class="mb-4">{{ card.term }}</h2>

        <div class="definition mb-4">
            <hr>
            <p class="lead fw-normal lh-lg">{{ card.definition }}</p>
            <hr>
            <p><strong>Did you recall this correctly?</strong></p>
            <form action="/answer" method="post" class="d-flex justify-content-center gap-2">
                <input type="hidden" name="card_id" value="{{ card.id }}">
                <button name="answer" value="yes" class="btn btn-success px-4">Yes</button>
                <button name="answer" value="no" class="btn btn-danger px-4">No</button>
            </form>
        </div>

        <button class="btn btn-secondary btn-reveal" onclick="document.getElementById('quiz-card').classList.add('revealed')">
            Show Definition
        </button>
        <div class="mt-3 d-flex justify-content-center gap-3 small">
            <a href="/end" class="link-secondary">End session</a>
            <a href="/stats" class="link-secondary">Stats</a>
        </div>
    </div>
</body>
</html>
