<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>Flashcard Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 560px;">
        <h1 class="text-center mb-1">Flashcard Session</h1>
        <p class="text-center text-muted small">DP-600 / Microsoft Fabric · {{ stats.total }} cards</p>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}

        <form action="/start" method="post">
            <label class="form-label">Study mode:</label>
            <select name="mode" class="form-select mb-3">
                <option value="any">Any Cards</option>
                <option value="new">Only New (not answered yet)</option>
                <option value="incorrect">Only Incorrect (last attempt failed)</option>
                {% for d in difficulties %}
                <option value="{{ d }}">Difficulty: {{ d|capitalize }}</option>
                {% endfor %}
            </select>

            <label class="form-label">Topic:</label>
            <select name="topic_id" class="form-select mb-3">
                <option value="all">All Topics</option>
                {% for t in topics %}
                <option value="{{ t.topic_id }}">{{ t.topic_id }} — {{ t.topic }}</option>
                {% endfor %}
            </select>

            <button type="submit" class="btn btn-primary w-100">Start Study</button>
        </form>

        <hr>
        <div class="d-flex justify-content-between align-items-center">
            <span class="small text-muted">Answered {{ stats.answered }}/{{ stats.total }} · {{ stats.accuracy }}% accuracy</span>
            <a href="/stats" class="btn btn-sm btn-outline-secondary">Stats</a>
        </div>
    </div>
</body>
</html>
